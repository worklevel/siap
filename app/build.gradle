plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk 33
    namespace 'wgg.siap'

    defaultConfig {
        applicationId "wgg.siap"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        ndk {
            abiFilters "armeabi-v7a", "armeabi", "x86", "x86_64"
        }
        packagingOptions {
            jniLibs {
                useLegacyPackaging true
            }
        }
        def keysPropertiesFile = rootProject.file("keys.properties")
        if (keysPropertiesFile.exists()) {
            def keysProperties = new Properties()
            keysProperties.load(new FileInputStream(keysPropertiesFile))
            buildConfigField "String", "ACCESS", "\"${keysProperties.getProperty("ACCESS")}\""

        }
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled false
            shrinkResources false

            applicationVariants.all { variant ->
                variant.outputs.all {
                    outputFileName = "siap_release.apk"
                }
            }
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

